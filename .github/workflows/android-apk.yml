name: Build Android Debug APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Debug (Vetor TCC)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22 (compatível com Capacitor 8)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java JDK 21 (exigido pelo Capacitor 8 / AGP 8.13)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Gradle 8.14.3 e cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Instalar dependências do projeto
        run: |
          if [ -f "package-lock.json" ]; then
            echo "Usando package-lock.json com npm ci..."
            npm ci
          elif [ -f "bun.lock" ] || [ -f "bun.lockb" ]; then
            echo "Lockfile do Bun detectado. Instalando dependências respeitando bun.lock..."
            npx --yes bun install --frozen-lockfile
          else
            echo "Nenhum lockfile versionado encontrado no repositório (ignorado pelo .gitignore). Executando npm install..."
            npm install --no-audit --no-fund
          fi

      - name: Executar verificação de tipos (Lint)
        run: npm run lint

      - name: Compilar aplicação Web (Vite Build)
        run: npm run build

      - name: Sincronizar Capacitor com Android
        run: npx cap sync android

      - name: Aceitar licenças do Android SDK (Compile SDK 36)
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Verificar e restaurar Gradle Wrapper (gradle-wrapper.jar)
        run: |
          if [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar ausente no repositório (ignorado pelo .gitignore). Gerando Wrapper no projeto Android real com Gradle 8.14.3..."
            gradle -p android wrapper --gradle-version 8.14.3 --no-daemon --stacktrace
          fi
          if [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Erro: android/gradle/wrapper/gradle-wrapper.jar não foi encontrado após a geração do Wrapper."
            exit 1
          fi
          chmod +x android/gradlew
          ls -lh android/gradle/wrapper/gradle-wrapper.jar

      - name: Compilar APK de depuração (assembleDebug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publicar APK como artefato para download
        uses: actions/upload-artifact@v4
        with:
          name: vetor-tcc-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
